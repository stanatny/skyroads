<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-version" content="1.1.0">
<title>Nebula Cruise</title>
<meta name="description" content="A fast sci-fi lane runner through an endless nebula.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./styles/game.css">
</head>
<body>
<canvas id="game" aria-label="Nebula Cruise game canvas"></canvas>
<div id="app-ui">
  <div id="command-frame" aria-hidden="true"></div>
  <nav id="utility-controls" aria-label="Game settings"></nav>
  <section id="title-screen" class="screen-panel"></section>
  <section id="pause-screen" class="screen-panel" role="status" aria-live="polite" aria-atomic="true" hidden></section>
  <section id="game-over-screen" class="screen-panel" hidden></section>
  <section id="leaderboard-dialog" role="dialog" aria-modal="true" hidden></section>
  <section id="rename-dialog" role="dialog" aria-modal="true" hidden></section>
  <p id="persistence-warning" role="status" hidden></p>
  <p id="aria-status" class="sr-only" aria-live="polite"></p>
</div>
<script defer src="./src/version.js"></script>
<script defer src="./src/i18n.js"></script>
<script defer src="./src/leaderboard.js"></script>
<script defer src="./src/presentation.js"></script>
<script defer src="./src/world-art.js"></script>
<script defer src="./src/scene-style.js"></script>
<script defer src="./src/drone-visual.js"></script>
<script defer src="./src/input.js"></script>
<script defer src="./src/obstacles.js"></script>
<script defer src="./src/gap-regions.js"></script>
<script defer src="./src/audio.js"></script>
<script defer src="./src/game.js"></script>
</body>
</html>
